function syncWordHighlight(a, gen){
  stopWordHighlight();
  const apply=()=>{
    if(gen!==listenGen || audio!==a) return;
    const els=[...$('sentence').querySelectorAll('.w')];
    const n=els.length;
    if(!n) return;
    const d=a.duration;
    let idx=0;
    if(d && isFinite(d) && d>0){
      const frac=Math.max(0, Math.min(0.999999, (a.currentTime||0)/d));
      idx=Math.min(n-1, Math.floor(frac*n));
    }
    for(let i=0;i<n;i++) els[i].classList.toggle('on', i===idx);
  };
  const tick=()=>{
    if(gen!==listenGen || audio!==a) return;
    apply();
    if(!a.paused && !a.ended) hlRaf=requestAnimationFrame(tick);
  };
  a.ontimeupdate=apply;
  a.onloadedmetadata=apply;
  apply();
  hlRaf=requestAnimationFrame(tick);
}

function canEnter(m){
  if(!pack) return false;
  const bp=bookProg(pack.book_id);
  if(m==='listen') return introDone;
  if(m==='read') return !!bp.listen;
  if(m==='song') return !!(bp.listen && bp.read);
  if(m==='dictation') return !!(bp.listen && bp.read && bp.song);
  if(m==='speak') return !!(bp.listen && bp.read && bp.song && bp.dictation);
  if(m==='pass') return !!(bp.listen && bp.read && bp.song && bp.dictation && bp.speak);
  return false;
}
function setMode(m){
  if(!pack) return;
  if(m!=='intro' && m!=='mode'){
    // Listen (and everything after it) stays shut until the start is finished.
    if(!introDone){
      $('status').textContent='Finish the sound and the famous word first.';
      showIntro();
      return;
    }
    // The start is finished: never bounce back into the intro (that would relock Listen).
    if(!canEnter(m)){
      const bp=bookProg(pack.book_id);
      if(!bp.listen) m='listen';
      else if(!bp.read) m='read';
      else if(!bp.song) m='song';
      else if(!bp.dictation) m='dictation';
      else if(!bp.speak) m='speak';
      else m='pass';
    }
  } else if(!canEnter(m)){
    m = introDone ? 'listen' : 'intro';
  }
  mode=m; stopA(); listenGen++; hideAll(); clipDone=false;
  $('workStage').classList.remove('dict-fit');
  $('modeBadge').textContent=m+' · '+(soundLine(pack.book_id)||pack.sound||'');
  $('mListen').classList.toggle('active', m==='listen');
  $('mSong').classList.toggle('active', m==='song');
  $('mRead').classList.toggle('active', m==='read');
  $('mDict').classList.toggle('active', m==='dictation');
  $('mSay').classList.toggle('active', m==='speak');
  syncModeLocks();
  if(m==='listen-end'){ $('workStage').classList.remove('hidden'); renderListenEnd(); }
  else if(m==='dictation'){ if(needsSheriff()){ showSheriff(); return; } $('workStage').classList.remove('hidden'); startDictation(); }
  else if(m==='speak'){ $('workStage').classList.remove('hidden'); startSpeak(); }
  else if(m==='pass'){ $('workStage').classList.remove('hidden'); renderPass(); }
  else { $('bookStage').classList.remove('hidden'); renderPage(); }
}
function allTapped(){

function arrowsFree(){

function nextLocked(){

function go(d){

    if(mode==='listen'){ setBookProg(pack.book_id,{listen:true}); reportProgress(pack.book_id,'listen',true); pageIndex=0; setMode('read'); return; }
    if(mode==='read'){ setBookProg(pack.book_id,{read:true}); reportProgress(pack.book_id,'read',true); pageIndex=0; setMode('song'); return; }
    if(mode==='song'){ setBookProg(pack.book_id,{song:true}); reportProgress(pack.book_id,'song',true); setMode('dictation'); return; }

function playPage(manual){
  const p=page();
  const path = mode==='song' ? p.song_audio : p.audio;
  clipDone=false; $('next').disabled=nextLocked();
  const rate = mode==='listen' ? LISTEN_RATE : 1;
  const gen=++listenGen;
  const startPage=pageIndex;
  const startMode=mode;
  if(mode==='listen'){
    let loop=0;
    const playOnce=()=>{
      if(gen!==listenGen || pageIndex!==startPage || mode!=='listen') return;
      loop++;
      $('status').textContent=`Listen ${loop} / ${LISTEN_LOOPS}`;
      playPath(path, ()=>{
        if(gen!==listenGen || pageIndex!==startPage || mode!=='listen') return;
        if(loop<LISTEN_LOOPS){ playOnce(); return; }
        clipDone=true;
        heardListen.add(pageIndex);
        document.querySelectorAll('.w').forEach(e=>e.classList.remove('on'));
        $('next').disabled=nextLocked();
        $('status').textContent=`${pageIndex+1} / ${pack.pages.length} · Page heard.`;
        if(manual) return;
        go(1);
      }, rate);
    };
    playOnce();
    return;
  }
  playPath(path, ()=>{
    if(gen!==listenGen || pageIndex!==startPage || mode!==startMode) return;
    clipDone=true;
    if(mode==='song') heardSong.add(pageIndex);
    document.querySelectorAll('.w').forEach(e=>e.classList.remove('on'));
    $('next').disabled=nextLocked();

function onWordTap(el){

    el.classList.add('on');
    tapped.add(pageIndex+':'+i); el.classList.add('done');
    if(allTapped()){
      const rp=Object.assign({}, bookProg(pack.book_id).readPages||{});
      rp[pageIndex]=true; setBookProg(pack.book_id,{readPages:rp});
      playWord(lem, ()=>{ if(mode==='read' && !wasDone) go(1); });
      return;
    }
  }
  playWord(lem);
}

function dictLettersOf(s){ return String(s||'').replace(/[^A-Za-z]/g,'').split(''); }
function renderEasyTpl(text, filled){

function renderDictTpl(text, filled){

      const v=filled[i++]||'';

  }).join('');

function dictNorm(s){ return String(s||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim(); }

function dictEasyTokens(s){
  const out=[];
  const re=/[A-Za-z']+|[,.!?;:]+|[“”"…]+/g;
  let m; const src=String(s||'');
  while((m=re.exec(src))) out.push(m[0]);
  return out;
}
function dictEasyJoin(arr){

  const want=lawWord().replace(/[^a-z]/g,'');
  if(!typed) return;
  if(typed===want){ sheriffOk=true; playNervousThenJail(); return; }
  const msg=$('sheriffMsg'); if(msg) msg.innerHTML="Don't lie to <span class=\"me\">me</span>.";
  const inp=$('sheriffName'); if(inp){ inp.value=''; inp.focus(); }
  const v=$('sheriffVid'); if(v){ try{v.pause();}catch(e){} }
  playPath('decodable/lawbreaker/dont_lie.mp3', ()=>{
    const vv=$('sheriffVid');
    if(vv){ vv.currentTime=0; vv.play().catch(()=>{}); }
  }, 1);
}
function playNervousThenJail(){
  mode='nervous'; stopA(); hideAll();
  $('workStage').classList.remove('hidden');
  $('modeBadge').textContent='Lawbreaker';
  const word=lawWord();
  const safe=String(word).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const vid=asset('decodable/lawbreaker/end_'+word+'.mp4');
  $('workBody').innerHTML=`<div class="scene" style="min-height:52vh">
      <video class="carpetVid" id="nervVid" src="${vid}" autoplay playsinline webkit-playsinline></video>
    </div>
    <div class="nervousWord">${safe}</div>
    <div class="nervousLine">I am ${safe}.</div>`;
  const v=$('nervVid');
  const done=()=>{ if(mode==='nervous') setMode('dictation'); };
  if(!v){ done(); return; }
  v.onended=done;
  v.onerror=()=>{
    if(mode!=='nervous') return;
    playPath('decodable/lawbreaker/nervous_'+word+'.mp3', ()=>{ if(mode==='nervous') playJailVideo(); }, 1);
  };
  v.play().catch(()=>{
    if($('nervSkip')) return;
    $('workBody').insertAdjacentHTML('beforeend','<button id="nervSkip" style="width:100%;margin-top:10px">Next</button>');
    $('nervSkip').onclick=done;
  });
}
function playJailVideo(){
  mode='jail'; stopA(); hideAll();
  $('workStage').classList.remove('hidden');
  $('modeBadge').textContent='Jail';
  const word=lawWord();
  const vid=asset('decodable/lawbreaker/jail_'+word+'.mp4');
  $('workBody').innerHTML=`<div class="scene" style="min-height:52vh">
      <video class="carpetVid" id="jailVid" src="${vid}" playsinline webkit-playsinline></video>

function markDict(ok){
  if(ok) dictRight++;
  dictIdx++;
  setTimeout(nextDict, 380);
}
function paintBuiltEasy(){
  const el=$('built');
  if(!dictBuilt.length){ el.textContent='…'; return; }
  el.innerHTML=dictBuilt.map((w,i)=>`<span class="chip" data-i="${i}">${w}</span>`).join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const i=+ch.dataset.i;
    const word=dictBuilt[i];
    dictBuilt.splice(i,1);
    const tile=[...document.querySelectorAll('.tile')].find(b=>b.classList.contains('used') && tileWord(b)===word);
    if(tile) tile.classList.remove('used');
    paintBuiltEasy();
  });
}
function paintSpeedBtns(){
  [['spd100',1],['spd80',0.8],['spd50',0.5]].forEach(([id,r])=>{
    const b=$(id); if(!b) return;
    b.classList.toggle('active', Math.abs(dictRate-r)<0.01);
    b.onclick=()=>{ dictRate=r; paintSpeedBtns(); };
  });
}
function nextDict(){
  if(dictIdx>=dictQueue.length){
    const pct=Math.round(100*dictRight/dictQueue.length);
    if(pct>=DICT_PASS){ setBookProg(pack.book_id,{dictation:true,dictScore:pct}); reportProgress(pack.book_id,'dictation',true,pct); setMode('speak'); }
    else {
      reportProgress(pack.book_id,'dictation',false,pct);
      $('workBody').innerHTML=`<div class="pass">${pct}%</div>
        <div style="text-align:center">Need 80% on 5 sentences. Try again.</div>
        <button id="retryD" style="width:100%;margin-top:14px">Try dictation again</button>`;
      $('retryD').onclick=()=>startDictation();
    }
    return;
  }
  const item=dictQueue[dictIdx];
  const targetTokens=dictEasyTokens(item.text);
  const wordTokens=targetTokens.filter(w=>/[A-Za-z]/.test(w));
  const hard=(bookProg(pack.book_id).difficulty||'easy')==='hard';
  dictBuilt=[];
  let tilesHtml='';
  if(hard){
    tilesHtml=`<div class="az">${'abcdefghijklmnopqrstuvwxyz'.split('').map(t=>`<button class="tile" data-ch="${t}">${t}</button>`).join('')}<button class="tile" data-ch="del">⌫</button></div>`;
  } else {
    const tiles=shuffle([
      ...wordTokens.map((w,i)=>({id:'t'+i,word:w})),
      ...fillerWords(wordTokens).map((w,i)=>({id:'f'+i,word:w}))
    ]);
    tilesHtml=`<div class="tiles">${tiles.map(t=>`<button class="tile" data-id="${t.id}" data-word="${encodeURIComponent(t.word)}">${t.word.replace(/</g,'&lt;')}</button>`).join('')}</div>`;
  }
  $('workBody').innerHTML=`
    <div class="dict-layout">
      <div class="dict-side">
        ${dictSpeaker()}
        <div class="choice"><button id="pickEasy" class="${hard?'':'active'}">Easy</button><button id="pickHard" class="${hard?'active':''}">Hard</button></div>
      </div>
      <div class="dict-main">
        <div class="g-lbl">Dictation ${dictIdx+1} / ${dictQueue.length} · ${hard?'Hard · letters':'Easy · words'}</div>
        <div class="tpl" id="built">${hard?renderDictTpl(item.text,[]):renderEasyTpl(item.text,[])}</div>
        ${tilesHtml}
        <div class="repeat spd">
          <button id="spd100" type="button">100%</button>
          <button id="spd80" type="button">80%</button>
          <button id="spd50" type="button">50%</button>
          <button id="hear1x" type="button">1x</button>
          <button id="hear3x" type="button">3x</button>
          <button id="hear5x" type="button">5x</button>
        </div>
        <button id="clearWord">Clear</button>
        <div class="status" id="dictStatus">Need 4 of 5. Right so far: ${dictRight}</div>
      </div>
    </div>`;
  const hearN=n=>playTimes(item.audio, n, dictRate);
  paintSpeedBtns();
  const pe=$('pickEasy'), ph=$('pickHard');
  if(pe) pe.onclick=()=>chooseDiff('easy');
  if(ph) ph.onclick=()=>chooseDiff('hard');
  $('hear1x').onclick=()=>hearN(1);
  $('hear3x').onclick=()=>hearN(3);
  $('hear5x').onclick=()=>hearN(5);
  $('clearWord').onclick=()=>{
    dictBuilt=[];
    if(hard) $('built').innerHTML=renderDictTpl(item.text,[]);
    else { $('built').innerHTML=renderEasyTpl(item.text,[]); document.querySelectorAll('.tile').forEach(b=>b.classList.remove('used')); }
  };
  if(hard){
    const need=dictLettersOf(item.text);
    document.querySelectorAll('.az .tile, .tile').forEach(b=>b.onclick=()=>{
      const ch=b.dataset.ch;
      if(!ch) return;
      if(ch==='del') dictBuilt.pop();
      else if(dictBuilt.length<need.length) dictBuilt.push(ch);
      $('built').innerHTML=renderDictTpl(item.text, dictBuilt);
      if(dictBuilt.length>=need.length){
        const ok=dictBuilt.join('').toLowerCase()===need.join('').toLowerCase();
        markDict(ok);
      }
    });
  } else {
    document.querySelectorAll('.tiles .tile').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('used')) return;
      b.classList.add('used');
      dictBuilt.push(tileWord(b));
      $('built').innerHTML=renderEasyTpl(item.text, dictBuilt);
      if(dictBuilt.length>=wordTokens.length){
        const ok=dictBuilt.map(w=>w.toLowerCase()).join(' ')===wordTokens.map(w=>w.toLowerCase()).join(' ');
        markDict(ok);
      }
    });
  }
  hearN(1);
}

function unlockMic(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  if(!micCtx || micCtx.state==='closed') micCtx=new C();
  if(micCtx.state==='suspended') micCtx.resume().catch(()=>{});
  return micCtx;
}

function paintSayChips(text, words){
  const parts=String(text||'').split(/(\s+)/);
  let wi=0;
  const scored=(words||[]).filter(w=>w && w.word);
  $('sayLineText').innerHTML=parts.map(tok=>{
    if(!tok.trim()) return tok;
    const lemma=tok.replace(/[^A-Za-z']/g,'').toLowerCase();
    if(!lemma) return tok.replace(/</g,'&lt;');
    const w=scored[wi];
    wi++;
    if(!w){
      return `<span class="word-chip pending">${tok.replace(/</g,'&lt;')}<span class="wsub">·</span></span>`;
    }
    const ws=Math.round(100*(w.score||0));
    const b=ws>=60?'good':'needs_work';
    const hint=(b==='needs_work' && typeof w.hint==='string' && w.hint.trim())
      ? `<span class="wsub">${w.hint.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>` : '';
    return `<span class="word-chip ${b}">${tok.replace(/</g,'&lt;')}<span class="wsub">${ws}%</span>${hint}</span>`;
  }).join('');
}

function wireRecorder(line){
  const btn=$('sayLine');
  const stopBtn=$('sayStop');
  const bars=$('recBars');
  let rec=null, chunks=[], stream=null, watch=null, analyser=null;
  const hideLive=()=>{
    stopBtn.classList.add('hidden');
    bars.classList.add('hidden');
    if(watch){ clearInterval(watch); watch=null; }
  };
  const stop=()=>{
    if(rec && rec.state!=='inactive') rec.stop();
  };
  const start=async ()=>{
    unlockMic();
    const nx=$('sayNext'); if(nx) nx.classList.add('hidden');
    $('speakStatus').textContent='Listening… speak now';
    $('speakHeard').textContent='';
    $('wordScores').innerHTML='';
    chunks=[];
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop=async ()=>{
      hideLive();
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks, {type: rec.mimeType||'audio/webm'});
      lastYouBlob=blob;
      await gradeBlob(line, blob);
    };
    rec.start();
    stopBtn.classList.remove('hidden');
    bars.classList.remove('hidden');
    const ctx=unlockMic();
    if(ctx){
      const src=ctx.createMediaStreamSource(stream);
      analyser=ctx.createAnalyser();
      analyser.fftSize=512;
      const silent=ctx.createGain(); silent.gain.value=0;
      src.connect(analyser); analyser.connect(silent); silent.connect(ctx.destination);
      const data=new Uint8Array(analyser.fftSize);
      let quiet=0, heard=false;
      watch=setInterval(()=>{
        analyser.getByteTimeDomainData(data);
        let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
        const rms=Math.sqrt(sum/data.length);
        const kids=[...bars.querySelectorAll('i')];
        kids.forEach((el,i)=>{ el.style.height=Math.max(6, Math.min(28, rms*140 + (i%3)*3))+'px'; });
        if(rms>0.04){ heard=true; quiet=0; $('speakStatus').textContent='Hearing you…'; }
        else if(heard){ quiet++; if(quiet>10) stop(); }
      }, 120);
    }
  };
  btn.onclick=async ev=>{
    ev.preventDefault();
    if(rec && rec.state==='recording') return;
    try{ await start(); }
    catch(e){ $('speakStatus').textContent='Mic blocked. Allow the microphone, then tap 🎙️ again.'; }
  };
  stopBtn.onclick=ev=>{ ev.preventDefault(); stop(); };
}
async function gradeBlob(line, blob){
  const nx=$('sayNext'); if(nx) nx.classList.add('hidden');
  $('speakStatus').textContent='Checking your speaking…';
  if(!window.MRJPronounce){
    hideLoadbar();
    $('speakStatus').textContent='Scoring engine missing. Reload the page.';
    return;
  }
  let j;
  try{
    if(!pronounceLoaded) setLoadbar({stage:'download',pct:5});
    await MRJPronounce.load(onPronounceProgress);
    $('speakStatus').textContent='Checking your speaking…';
    startGradeBarAnim(pronounceLoaded?55:30);
    j=await MRJPronounce.grade(blob, line);
  }catch(e){
    hideLoadbar();
    $('speakStatus').textContent='Scoring failed. Tap 🎙️ again. '+(e && e.message ? e.message : '');
    return;
  }
  hideLoadbar();
  if(j.meta && String(j.meta.scoring_mode||'').startsWith('stub')){
    $('speakStatus').textContent='Grader came back stub. Real model did not load.';
    return;
  }
  if(j.doorFail){
    hideLoadbar();
    $('speakStatus').textContent=j.reason||'';
    return;
  }
  const sc=Math.round(100*(j.overall&&j.overall.score||0));
  const band=(j.overall&&j.overall.band)||'';
  $('speakHeard').textContent=sc+'% · '+band+' · '+(j.model_id||'');
  paintSayChips(line, j.words||[]);
  $('wordScores').innerHTML='';
  if(sc>=SPEAK_DEFAULT){
    $('speakStatus').textContent=sc+'% — you passed! Tap Next.';
    const nextBtn=$('sayNext');
    if(nextBtn){
      nextBtn.classList.remove('hidden');
      nextBtn.onclick=()=>finishSayPage(sc);
    }
  }else{
    sayTries++;
    if(sc>sayBest) sayBest=sc;
    sayTriesSave();
    if(sayTries>=SAY_MAX_TRIES){
      $('speakStatus').textContent=sc+'% — 5 tries. Next page.';
      const mic=$('sayLine'); if(mic) mic.disabled=true;
      armSayAdvance(sayBest);
    }else $('speakStatus').textContent=sc+'% — try '+sayTries+' of '+SAY_MAX_TRIES+'. Say it again.';
  }
}
function finishSayPage(score){
  sayTriesClear();
  const sp=Object.assign({}, bookProg(pack.book_id).speakPages||{});
  sp[sayPage]=score; setBookProg(pack.book_id,{speakPages:sp});
  sayPage++;
  if(sayPage>=pack.pages.length){
    setBookProg(pack.book_id,{speak:true});
    reportProgress(pack.book_id,'speak',true,speakScorePct());
    setMode('pass');
  }
  else renderSay();
}

function testGo(d){
  if(!TEST) return;
  if(mode==='library' || !pack){
    if(d>0){
      const id=(lastTestBook && bookOrder().includes(lastTestBook)) ? lastTestBook : bookOrder()[0];
      if(id) openBook(id);
    }
    return;
  }
  if(mode==='intro'){
    if(d<0){ testBackIntro(); return; }
    introAdvance();
    return;
  }
  if(mode==='listen' || mode==='song' || mode==='read'){
    const nxt=pageIndex+d;
    if(nxt<0){
      if(mode==='listen'){
        introStep=(pack.law_breaker||[]).length ? 'chase' : 'famous';
        showIntro();
        return;
      }
      if(mode==='song'){ setMode('listen-end'); return; }
      pageIndex=pack.pages.length-1; setMode('song'); return;
    }
    if(nxt>=pack.pages.length){
      if(mode==='listen'){ setMode('listen-end'); return; }
      if(mode==='song'){ pageIndex=0; setMode('read'); return; }
      if(needsSheriff()){ showSheriff(); return; }
      jumpDict(0); return;
    }
    pageIndex=nxt; clipDone=true; renderPage();
    return;
  }
  if(mode==='sheriff'){
    if(d<0){ pageIndex=pack.pages.length-1; setMode('read'); return; }
    return;
  }
  if(mode==='nervous'){
    if(d<0){ sheriffOk=false; showSheriff(); return; }
    playJailVideo(); return;
  }
  if(mode==='jail'){
    if(d<0){ sheriffOk=false; showSheriff(); return; }
    setMode('dictation'); return;
  }
  if(mode==='listen-end'){
    if(d<0){ pageIndex=pack.pages.length-1; setMode('listen'); return; }
    pageIndex=0; setMode('song'); return;
  }
  if(mode==='dictation'){
    if($('pickEasy') && !$('hear1x')){
      if(d<0){ pageIndex=pack.pages.length-1; setMode('read'); return; }
      setBookProg(pack.book_id,{difficulty:'easy'});
      jumpDict(0); return;
    }
    if(d<0){
      if(dictIdx>0){ jumpDict(dictIdx-1); return; }
      pageIndex=pack.pages.length-1; setMode('read'); return;
    }
    if(dictIdx<dictQueue.length-1){ jumpDict(dictIdx+1); return; }
    sayPage=0; setMode('speak'); return;
  }
  if(mode==='speak'){
    if(d<0){
      if(sayPage>0){ sayPage--; renderSay(); return; }
      jumpDict(Math.max(0, (dictItems().length||1)-1)); return;
    }
    if(sayPage<pack.pages.length-1){ sayPage++; renderSay(); return; }
    setMode('pass'); return;
  }
  if(mode==='pass'){
    if(d<0){ sayPage=pack.pages.length-1; setMode('speak'); return; }
    const order=bookOrder();
    const i=order.indexOf(pack.book_id);
    if(order[i+1]) openBook(order[i+1]);
    else showLib();
  }
}
function testBackIntro(){
  const letters=cousinLetters();
  if(introStep==='cousin'){
    if(cousinIdx>0){ cousinIdx--; showIntro(); return; }
    showLib(); return;
  }
  if(introStep==='famous-card'){
    if(letters.length){ introStep='cousin'; cousinIdx=letters.length-1; showIntro(); return; }
    showLib(); return;
  }
  if(introStep==='famous'){ introStep='famous-card'; showIntro(); return; }
  if(introStep==='chase' || introStep==='jail'){ introStep='famous'; showIntro(); return; }
  showLib();
}
function jumpDict(idx){
  setBookProg(pack.book_id,{difficulty: bookProg(pack.book_id).difficulty || 'easy'});
  dictQueue=dictItems();
  dictIdx=Math.max(0, Math.min(idx, Math.max(0, dictQueue.length-1)));
  dictRight=0;
  mode='dictation'; stopA(); listenGen++; hideAll(); clipDone=false;
  $('modeBadge').textContent='dictation · '+(soundLine(pack.book_id)||pack.sound||'');
  $('mListen').classList.remove('active');
  $('mSong').classList.remove('active');
  $('mRead').classList.remove('active');
  $('mDict').classList.add('active');
  $('mSay').classList.remove('active');
  $('workStage').classList.remove('hidden');
  nextDict();
}
boot();
</script>
